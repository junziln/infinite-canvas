limit_req_zone $binary_remote_addr zone=prompt_api_per_ip:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=prompt_assets_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=prompt_assets_conn_per_ip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name canvas.tokenshen.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name canvas.tokenshen.top;

    ssl_certificate     /etc/nginx/certs/canvas.tokenshen.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/canvas.tokenshen.top/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /www/tokenshen-web/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/tokenshen/canvas.access.log main;
    error_log  /var/log/nginx/tokenshen/canvas.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    limit_req_status 429;
    limit_conn_status 429;

    location ^~ /prompt-api/ {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        limit_req zone=prompt_api_per_ip burst=10 nodelay;
    }

    location = /prompt-data/prompts.json {
        add_header Cache-Control "no-store";
        return 404;
    }

    location ^~ /prompt-data/ {
        alias /www/tokenshen-prompts/current/data/;
        autoindex off;
        expires 5m;
        add_header Cache-Control "public, max-age=300";

        limit_except GET HEAD {
            deny all;
        }
    }

    location ^~ /prompt-assets/ {
        alias /www/tokenshen-prompts/current/images/;
        autoindex off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        limit_req zone=prompt_assets_per_ip burst=20 nodelay;
        limit_conn prompt_assets_conn_per_ip 20;

        limit_except GET HEAD {
            deny all;
        }
    }

    location ^~ /prompt-licenses/ {
        alias /www/tokenshen-prompts/current/licenses/;
        autoindex off;
        expires 1d;

        limit_except GET HEAD {
            deny all;
        }
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
